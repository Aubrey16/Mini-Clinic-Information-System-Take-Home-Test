services:
  db:
    image: postgres:16-alpine
    container_name: mini-clinic-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_clinic
    ports:
      - "5432:5432"
    volumes:
      - mini_clinic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_clinic"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mini_clinic_pgdata:
