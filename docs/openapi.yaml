openapi: 3.0.3

info:
  title: Mini Clinic Information System API
  version: 1.0.0
  description: |
    REST API for the Mini Clinic Information System.

    Covers the 6 core features from the PRD: authentication (JWT),
    patient master data, patient registration, queue management,
    doctor examination (SOAP), and the dashboard.

    **Roles:** `administration`, `doctor`, `registration_officer`

    **Auth:** all endpoints except `/login` require a Bearer token
    (`Authorization: Bearer <token>`).

servers:
  - url: http://localhost:5000
    description: Local development

tags:
  - name: Auth
  - name: Patients
  - name: Registrations
  - name: Queues
  - name: Medical Records
  - name: Prescriptions
  - name: Dashboard

paths:
  /login:
    post:
      tags: [Auth]
      summary: Login and get a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@klinik.test
              password: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                          user:
                            $ref: '#/components/schemas/User'
              example:
                success: true
                message: Login successful
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    id: 1
                    full_name: Admin Klinik
                    email: admin@klinik.test
                    role: administration
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logout:
    post:
      tags: [Auth]
      summary: Logout (client discards the token)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              example:
                success: true
                message: Logout successful
                data: null

  /patients:
    get:
      tags: [Patients]
      summary: List patients (search + pagination)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: search, schema: { type: string }, description: 'Search by name, NIK, or medical record number' }
        - { in: query, name: page,  schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 100 } }
      responses:
        '200':
          description: Paginated patient list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Patient' }
                          meta: { $ref: '#/components/schemas/PaginationMeta' }
              example:
                success: true
                message: Success
                data:
                  items:
                    - id: 1
                      medical_record_no: RM-000001
                      nik: '3273011201990001'
                      full_name: Andi Pratama
                      gender: L
                      birth_date: '1999-01-12'
                      phone: 0812-3456-7890
                      address: Jl. Merdeka No. 10, Bandung
                  meta:
                    page: 1
                    limit: 10
                    total_items: 4
                    total_pages: 1
    post:
      tags: [Patients]
      summary: Create a patient
      description: '`medical_record_no` (RM-000001) is auto-generated by the database.'
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientInput' }
            example:
              nik: '3273010101990005'
              full_name: Rina Saputri
              gender: P
              birth_date: '2001-01-01'
              phone: '081234567890'
              address: Jl. Kenanga No. 3, Bandung
      responses:
        '201':
          description: Patient created (RM number auto-generated)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Patient' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /patients/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Patients]
      summary: Get patient detail
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Patient detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Patient' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Patients]
      summary: Update a patient
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientInput' }
      responses:
        '200':
          description: Patient updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Patient' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Patients]
      summary: Delete a patient (soft delete)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Patient deleted (soft delete keeps medical history)
          content:
            application/json:
              example:
                success: true
                message: Patient deleted successfully
                data: null
        '404':
          $ref: '#/components/responses/NotFound'

  /registrations:
    get:
      tags: [Registrations]
      summary: List registrations
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: date,   schema: { type: string, format: date } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/RegistrationStatus' } }
        - { in: query, name: page,   schema: { type: integer, default: 1 } }
        - { in: query, name: limit,  schema: { type: integer, default: 10 } }
      responses:
        '200':
          description: Registration list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Registration' }
                          meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Registrations]
      summary: Create a visit registration
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationInput' }
            example:
              patient_id: 2
              doctor_id: 1
              poli_id: 1
              visit_date: '2026-09-10'
              payment_type: bpjs
              chief_complaint: Nyeri kepala dan pusing sejak pagi.
      responses:
        '201':
          description: Registration created (status starts at `menunggu`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Registration' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /registrations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Registrations]
      summary: Update a registration (incl. status)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationUpdate' }
            example:
              status: check_in
      responses:
        '200':
          description: Registration updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Registration' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /queues:
    get:
      tags: [Queues]
      summary: List queues
      description: Defaults to today's queues. Queue numbers look like `A001` (per poli per day).
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        '200':
          description: Queue list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/Queue' }
              example:
                success: true
                message: Success
                data:
                  items:
                    - id: 1
                      queue_number: A001
                      queue_date: '2026-09-10'
                      status: pemeriksaan
                      called_at: '2026-09-10T08:00:00Z'
                      registration:
                        id: 1
                        patient: { id: 1, full_name: Andi Pratama, medical_record_no: RM-000001 }
                        doctor: { id: 1, full_name: dr. Budi Santoso }
                        poli: { id: 1, name: Poli Umum }
    post:
      tags: [Queues]
      summary: Create a queue from a registration
      description: The queue number is auto-generated by the database.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_id]
              properties:
                registration_id: { type: integer, example: 2 }
      responses:
        '201':
          description: Queue created (status `menunggu`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Queue' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /queues/{id}/call:
    put:
      tags: [Queues]
      summary: Call this queue
      description: Sets status to `dipanggil` and stamps `called_at`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Queue called
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Queue' }
        '404':
          $ref: '#/components/responses/NotFound'

  /queues/{id}/status:
    put:
      tags: [Queues]
      summary: Change queue status
      description: |
        Transitions and their timestamps:
        `menunggu` → `dipanggil` (called_at) → `pemeriksaan` (started_at) → `selesai` (finished_at).
        `dibatalkan` is allowed from `menunggu`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/QueueStatus' }
            example:
              status: selesai
      responses:
        '200':
          description: Queue status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Queue' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /medical-records:
    post:
      tags: [Medical Records]
      summary: Save a SOAP examination
      description: |
        Saves the SOAP note plus medical actions and prescriptions in a single
        transaction, then flips the registration to `selesai` and the queue to `selesai`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicalRecordInput' }
            example:
              registration_id: 1
              patient_id: 1
              doctor_id: 1
              subjective: Demam dan batuk sejak dua hari lalu.
              blood_pressure: 120/80
              body_temperature: 36.8
              weight_kg: 65
              height_cm: 170
              assessment: ISPA derajat ringan.
              plan: Istirahat cukup, perbanyak minum.
              medical_actions:
                - name: Pemeriksaan fisik umum
                  notes: Tenggorokan sedikit merah.
              prescriptions:
                - notes: Obat penurun demam.
                  items:
                    - medicine_name: Paracetamol
                      dosage: 500 mg
                      frequency: 3x sehari
                      duration: 3 hari
                      instructions: Diminum setelah makan
      responses:
        '201':
          description: Examination saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MedicalRecord' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /medical-records/{patientId}:
    get:
      tags: [Medical Records]
      summary: Get a patient's examination history
      security: [{ bearerAuth: [] }]
      parameters:
        - name: patientId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Examination history (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/MedicalRecord' }
        '404':
          $ref: '#/components/responses/NotFound'

  /prescriptions:
    post:
      tags: [Prescriptions]
      summary: Save a prescription
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrescriptionInput' }
            example:
              medical_record_id: 1
              patient_id: 1
              doctor_id: 1
              notes: Obat penurun demam.
              items:
                - medicine_name: Paracetamol
                  dosage: 500 mg
                  frequency: 3x sehari
                  duration: 3 hari
                  instructions: Diminum setelah makan
      responses:
        '201':
          description: Prescription saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Prescription' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /prescriptions/{id}:
    get:
      tags: [Prescriptions]
      summary: Get prescription detail (with items)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Prescription detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Prescription' }
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard counters (today)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The five dashboard numbers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Dashboard' }
              example:
                success: true
                message: Success
                data:
                  total_patients: 4
                  total_patients_today: 3
                  total_queue_today: 3
                  total_waiting: 1
                  total_finished: 0

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
      description: Numeric ID

  responses:
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          example:
            success: false
            message: Unauthorized
            errors: {}
    NotFound:
      description: Resource not found
      content:
        application/json:
          example:
            success: false
            message: Resource not found
            errors: {}
    ValidationError:
      description: Validation error
      content:
        application/json:
          example:
            success: false
            message: Validation Error
            errors:
              nik: NIK must be exactly 16 digits and unique

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Success }
        data: {}

    User:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string, example: Admin Klinik }
        email: { type: string, example: admin@klinik.test }
        role: { $ref: '#/components/schemas/Role' }

    Role:
      type: string
      enum: [administration, doctor, registration_officer]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }

    Patient:
      allOf:
        - $ref: '#/components/schemas/PatientInput'
        - type: object
          properties:
            id: { type: integer }
            medical_record_no: { type: string, example: RM-000001, description: Auto-generated }

    PatientInput:
      type: object
      required: [nik, full_name, gender, birth_date, phone, address]
      properties:
        nik: { type: string, example: '3273011201990001', description: Exactly 16 digits, unique }
        full_name: { type: string, example: Andi Pratama }
        gender: { type: string, enum: [L, P], description: 'L = Laki-laki, P = Perempuan' }
        birth_date: { type: string, format: date, example: '1999-01-12' }
        phone: { type: string, example: 0812-3456-7890 }
        address: { type: string, example: Jl. Merdeka No. 10, Bandung }

    RegistrationStatus:
      type: string
      enum: [menunggu, check_in, pemeriksaan, selesai]

    QueueStatus:
      type: string
      enum: [menunggu, dipanggil, pemeriksaan, selesai, dibatalkan]

    PaymentType:
      type: string
      enum: [bpjs, tunai, asuransi]

    Registration:
      allOf:
        - $ref: '#/components/schemas/RegistrationInput'
        - type: object
          properties:
            id: { type: integer }
            status: { $ref: '#/components/schemas/RegistrationStatus' }
            created_at: { type: string, format: date-time }
            patient: { $ref: '#/components/schemas/Patient' }
            doctor: { $ref: '#/components/schemas/Doctor' }
            poli: { $ref: '#/components/schemas/Poli' }

    RegistrationInput:
      type: object
      required: [patient_id, doctor_id, poli_id, payment_type]
      properties:
        patient_id: { type: integer }
        doctor_id: { type: integer }
        poli_id: { type: integer }
        visit_date: { type: string, format: date, description: Defaults to today }
        payment_type: { $ref: '#/components/schemas/PaymentType' }
        chief_complaint: { type: string, description: Keluhan awal }

    RegistrationUpdate:
      type: object
      properties:
        patient_id: { type: integer }
        doctor_id: { type: integer }
        poli_id: { type: integer }
        visit_date: { type: string, format: date }
        payment_type: { $ref: '#/components/schemas/PaymentType' }
        chief_complaint: { type: string }
        status: { $ref: '#/components/schemas/RegistrationStatus' }

    Queue:
      type: object
      properties:
        id: { type: integer }
        queue_number: { type: string, example: A001, description: Auto-generated per poli per day }
        queue_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/QueueStatus' }
        called_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        registration: { $ref: '#/components/schemas/Registration' }

    MedicalRecord:
      allOf:
        - $ref: '#/components/schemas/MedicalRecordInput'
        - type: object
          properties:
            id: { type: integer }
            examined_at: { type: string, format: date-time }
            medical_actions:
              type: array
              items: { $ref: '#/components/schemas/MedicalAction' }
            prescriptions:
              type: array
              items: { $ref: '#/components/schemas/Prescription' }

    MedicalRecordInput:
      type: object
      required: [registration_id, patient_id, doctor_id]
      properties:
        registration_id: { type: integer }
        patient_id: { type: integer }
        doctor_id: { type: integer }
        subjective: { type: string, description: 'S — Keluhan pasien' }
        blood_pressure: { type: string, example: 120/80 }
        body_temperature: { type: number, example: 36.8, description: Celsius }
        weight_kg: { type: number, example: 65 }
        height_cm: { type: number, example: 170 }
        assessment: { type: string, description: 'A — Diagnosa' }
        plan: { type: string, description: 'P — Rencana terapi' }
        medical_actions:
          type: array
          items: { $ref: '#/components/schemas/MedicalAction' }
        prescriptions:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionInput' }

    MedicalAction:
      type: object
      required: [name]
      properties:
        id: { type: integer }
        name: { type: string, example: Pemeriksaan fisik umum }
        notes: { type: string }

    Prescription:
      allOf:
        - $ref: '#/components/schemas/PrescriptionInput'
        - type: object
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }
            items:
              type: array
              items: { $ref: '#/components/schemas/PrescriptionItem' }

    PrescriptionInput:
      type: object
      required: [medical_record_id, patient_id, doctor_id]
      properties:
        medical_record_id: { type: integer }
        patient_id: { type: integer }
        doctor_id: { type: integer }
        notes: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionItem' }

    PrescriptionItem:
      type: object
      required: [medicine_name, dosage, frequency]
      properties:
        id: { type: integer }
        medicine_name: { type: string, example: Paracetamol }
        dosage: { type: string, example: 500 mg }
        frequency: { type: string, example: 3x sehari }
        duration: { type: string, example: 3 hari }
        instructions: { type: string, example: Diminum setelah makan }

    Dashboard:
      type: object
      properties:
        total_patients: { type: integer, example: 4 }
        total_patients_today: { type: integer, example: 3 }
        total_queue_today: { type: integer, example: 3 }
        total_waiting: { type: integer, example: 1 }
        total_finished: { type: integer, example: 0 }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        total_items: { type: integer, example: 4 }
        total_pages: { type: integer, example: 1 }
